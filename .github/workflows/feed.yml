name: Atualizar feed Valpi Motor

on:
  schedule:
    - cron: "0 6,14 * * *"   # 06:00 e 14:00 UTC (= 07h e 15h em PT no verao); ajusta a gosto
  workflow_dispatch: {}       # permite correr a mao no separador Actions

permissions:
  contents: write             # necessario para o bot fazer commit do XML

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Gerar o feed
        run: python build_feed.py

      - name: Commit se o stock mudou
        run: |
          git config user.name  "valpi-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add valpimotor_stock.xml
          git diff --staged --quiet || git commit -m "Stock automatico ($(date -u +'%F %T') UTC)"
          git push
